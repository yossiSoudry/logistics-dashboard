<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="לוח בקרה למלאי ולמשלוחים של חברת משלוחים קטנה, על נתוני דמה." />
    <title>לוח בקרה למלאי ולוגיסטיקה</title>
    <script>
      // מחיל מצב בהיר או כהה לפני שהעמוד מצויר, כדי שלא יהיה הבהוב.
      // הלוגיקה המלאה והנבדקת נמצאת ב-src/lib/theme.js.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("logistics-dashboard-theme") || "system"; } catch (e) {}
        var dark = pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
