# CI על כל Pull Request: בדיקות ובנייה. בדיקה שנכשלת חוסמת את המיזוג (Practice.md, ענפים ו-CI).
# פרסום ל-GitHub Pages רק אחרי מיזוג ל-main.
name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR: גרסה חדשה של הענף מבטלת בדיקה ישנה. main: פרסום אחד אחרי השני, בלי לבטל.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # האתר נבנה בלי שום טוקן: הנתונים מגיעים מהפונקציה ב-Vercel (כתובתה בקוד, ערך ציבורי).
      - run: pnpm build
      # SPEC.md, נתונים מ-Airtable: נכשל (ועוצר את המיזוג והפרסום) אם בקוד האתר יש טוקן או כתובת של Airtable
      - run: pnpm check:bundle
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # רק מיזוג ל-main מגיע לאתר החי
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
